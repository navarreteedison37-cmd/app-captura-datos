name: Compilar APK instalable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Descargar dependencias
        run: flutter pub get

      - name: Generar plataforma Android si falta
        run: flutter create . --platforms=android

      - name: Desactivar minificacion R8
        run: |
          python3 - <<'PY'
          import pathlib, re
          kts = pathlib.Path('android/app/build.gradle.kts')
          gradle = pathlib.Path('android/app/build.gradle')
          def patch(text, kotlin):
              if kotlin:
                  text = re.sub(r'isMinifyEnabled\s*=\s*true', 'isMinifyEnabled = false', text)
                  text = re.sub(r'isShrinkResources\s*=\s*true', 'isShrinkResources = false', text)
              else:
                  text = re.sub(r'minifyEnabled\s+true', 'minifyEnabled false', text)
                  text = re.sub(r'shrinkResources\s+true', 'shrinkResources false', text)
              return text
          if kts.exists():
              kts.write_text(patch(kts.read_text(), True))
          elif gradle.exists():
              gradle.write_text(patch(gradle.read_text(), False))
          PY

      - name: Compilar APK release
        run: flutter build apk --release

      - name: Firmar y validar APK instalable
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          SIGNED="build/app/outputs/flutter-apk/app-release-signed.apk"
          ALIGNED="build/app/outputs/flutter-apk/app-release-aligned.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -f "$APK"
          keytool -genkeypair -keystore android-release.keystore -storepass android -keypass android -alias androidrelease -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Captura de Datos, OU=Mobile, O=Captura de Datos, L=Lima, ST=Lima, C=PE" -noprompt
          "$ZIPALIGN" -f -p 4 "$APK" "$ALIGNED"
          "$APKSIGNER" sign --ks android-release.keystore --ks-key-alias androidrelease --ks-pass pass:android --key-pass pass:android --out "$SIGNED" "$ALIGNED"
          "$APKSIGNER" verify --verbose "$SIGNED"
          unzip -t "$SIGNED" >/dev/null
          echo "APK firmado y verificado: $SIGNED"

      - name: Publicar APK instalable
        uses: actions/upload-artifact@v4
        with:
          name: app-captura-datos-apk-instalable
          path: build/app/outputs/flutter-apk/app-release-signed.apk
          if-no-files-found: error
